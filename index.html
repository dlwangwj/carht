<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>合同签署</title>
<style>
:root {
  color-scheme: light;
  --pri: #1565c0;
  --bg: #f0f2f5;
  --card: #fff;
  --txt: #1a1a1a;
  --sub: #666;
  --brd: #e0e0e0;
  --err: #c62828;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Noto Sans SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100dvh;
  padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
}

/* HEADER */
.hdr {
  background: var(--pri);
  color: #fff;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-bottom: 12px;
  padding-left: 16px;
  padding-right: 16px;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 200;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
}

.hdr-title { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 10px; }

.prog-bar { height: 3px; background: rgba(255,255,255,.3); border-radius: 2px; overflow: hidden; }
.prog-fill { height: 100%; background: #fff; border-radius: 2px; transition: width .35s ease; }
.step-info { text-align: center; font-size: 12px; opacity: .8; margin-top: 5px; }

/* CONTENT */
.content { padding: 16px; max-width: 480px; margin: 0 auto; }

.step { display: none; }
.step.active { display: block; }

/* CARDS */
.card {
  background: var(--card);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}

.card-hd {
  font-size: 14px;
  font-weight: 700;
  color: var(--pri);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--brd);
}

/* TYPE SELECTION */
.type-intro {
  text-align: center;
  font-size: 15px;
  color: var(--sub);
  margin-bottom: 20px;
  padding-top: 8px;
}

.type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.type-card {
  border: 2px solid var(--brd);
  border-radius: 16px;
  padding: 28px 12px 22px;
  text-align: center;
  cursor: pointer;
  background: var(--card);
  transition: border-color .15s, background .15s, box-shadow .15s;
  user-select: none;
  -webkit-user-select: none;
}

.type-card:active { transform: scale(.96); }

.type-card.sel {
  border-color: var(--pri);
  background: #e8f0fe;
  box-shadow: 0 0 0 3px rgba(21,101,192,.18);
}

.type-icon { font-size: 42px; margin-bottom: 10px; line-height: 1; }
.type-name { font-size: 14px; font-weight: 700; color: var(--txt); }
.type-sub { font-size: 12px; color: var(--sub); margin-top: 4px; }

/* FIELDS */
.field { margin-bottom: 13px; }
.field:last-child { margin-bottom: 0; }

label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 5px; }
label .req { color: var(--err); margin-left: 1px; }

input[type=text],
input[type=tel],
input[type=number],
input[type=datetime-local] {
  width: 100%;
  border: 1.5px solid var(--brd);
  border-radius: 9px;
  padding: 11px 13px;
  font-size: 16px;
  color: var(--txt);
  background: #fff;
  -webkit-appearance: none;
  appearance: none;
  font-family: inherit;
  outline: none;
}

input:focus {
  border-color: var(--pri);
  box-shadow: 0 0 0 3px rgba(21,101,192,.13);
}

input::placeholder { color: #bbb; }

.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* SIGNATURE CANVAS */
.sig-wrap {
  border: 1.5px dashed #ccc;
  border-radius: 10px;
  background: #fafafa;
  position: relative;
  overflow: hidden;
}

.sig-wrap canvas {
  display: block;
  width: 100%;
  height: 165px;
  touch-action: none;
  cursor: crosshair;
}

.sig-hint {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
  color: #c0c0c0;
  font-size: 13px;
}

.sig-hint-icon { font-size: 30px; }

.sig-actions { display: flex; justify-content: flex-end; margin-top: 8px; }

.btn-clear {
  padding: 7px 18px;
  border: 1.5px solid var(--brd);
  border-radius: 8px;
  background: #fff;
  color: var(--sub);
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
}

/* REVIEW */
.review-kv { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 14px; line-height: 1.6; }
.review-kv dt { color: var(--sub); white-space: nowrap; }
.review-kv dd { color: var(--txt); word-break: break-all; }

.gen-btn {
  width: 100%;
  margin-top: 4px;
  padding: 16px;
  background: #2e7d32;
  color: #fff;
  border: none;
  border-radius: 13px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: .5px;
  box-shadow: 0 3px 8px rgba(46,125,50,.35);
}

.gen-btn:active { background: #1b5e20; }

.gen-note {
  text-align: center;
  font-size: 12px;
  color: #999;
  margin-top: 10px;
  line-height: 1.6;
}

/* NAVIGATION */
.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #fff;
  border-top: 1px solid var(--brd);
  padding: 10px 16px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex;
  gap: 10px;
  z-index: 200;
}

.btn {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  font-family: inherit;
  min-height: 50px;
}

.btn-back { background: var(--bg); color: var(--txt); }
.btn-fwd  { background: var(--pri); color: #fff; }
</style>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-title" id="hdr-title">选择合同类型</div>
  <div class="prog-bar"><div class="prog-fill" id="prog" style="width:0%"></div></div>
  <div class="step-info" id="step-info">第 1 步，共 7 步</div>
</div>

<div class="content">

<!-- ── STEP 0: Type Selection ── -->
<div class="step active" id="s0">
  <p class="type-intro">请选择需要签署的合同类型</p>
  <div class="type-grid">
    <div class="type-card" id="tc-rental" onclick="selectType('rental',this)">
      <div class="type-icon">🚗</div>
      <div class="type-name">汽车租赁合同</div>
      <div class="type-sub">车辆出租协议</div>
    </div>
    <div class="type-card" id="tc-driver" onclick="selectType('driver',this)">
      <div class="type-icon">🤝</div>
      <div class="type-name">代驾协议</div>
      <div class="type-sub">代驾服务协议</div>
    </div>
  </div>
</div>

<!-- ── STEP 1 租赁: Party A ── -->
<div class="step" id="s1-rental">
  <div class="card">
    <div class="card-hd">甲方信息（出租方）</div>
    <div class="field"><label>姓名 <span class="req">*</span></label>
      <input type="text" id="ra-name" placeholder="请输入姓名"></div>
    <div class="field"><label>签约地点 <span class="req">*</span></label>
      <input type="text" id="ra-loc" placeholder="请输入签约地点"></div>
    <div class="field"><label>经办人</label>
      <input type="text" id="ra-handler" placeholder="经办人姓名（选填）"></div>
    <div class="field"><label>服务热线</label>
      <input type="tel" id="ra-tel" placeholder="联系电话（选填）"></div>
  </div>
</div>

<!-- ── STEP 1 代驾: Party A ── -->
<div class="step" id="s1-driver">
  <div class="card">
    <div class="card-hd">甲方信息（委托方）</div>
    <div class="field"><label>姓名 <span class="req">*</span></label>
      <input type="text" id="da-name" placeholder="请输入姓名"></div>
    <div class="field"><label>身份证号 <span class="req">*</span></label>
      <input type="text" id="da-id" placeholder="请输入身份证号" maxlength="18" inputmode="text"></div>
    <div class="field"><label>联系电话 <span class="req">*</span></label>
      <input type="tel" id="da-tel" placeholder="请输入手机号码"></div>
  </div>
  <div class="card">
    <div class="card-hd">车辆信息</div>
    <div class="field"><label>车辆品牌 <span class="req">*</span></label>
      <input type="text" id="da-brand" placeholder="如：大众、丰田"></div>
    <div class="field"><label>车辆型号 <span class="req">*</span></label>
      <input type="text" id="da-model" placeholder="如：帕萨特、凯美瑞"></div>
    <div class="field"><label>车牌号 <span class="req">*</span></label>
      <input type="text" id="da-plate" placeholder="如：粤A·12345"></div>
  </div>
</div>

<!-- ── STEP 2 租赁: Party B ── -->
<div class="step" id="s2-rental">
  <div class="card">
    <div class="card-hd">乙方信息（承租方）</div>
    <div class="field"><label>姓名 <span class="req">*</span></label>
      <input type="text" id="rb-name" placeholder="请输入姓名"></div>
    <div class="field"><label>签约地点 <span class="req">*</span></label>
      <input type="text" id="rb-loc" placeholder="请输入签约地点"></div>
    <div class="field"><label>身份证号 <span class="req">*</span></label>
      <input type="text" id="rb-id" placeholder="请输入身份证号" maxlength="18" inputmode="text"></div>
    <div class="field"><label>联系电话 <span class="req">*</span></label>
      <input type="tel" id="rb-tel" placeholder="请输入手机号码"></div>
  </div>
</div>

<!-- ── STEP 2 代驾: Party B ── -->
<div class="step" id="s2-driver">
  <div class="card">
    <div class="card-hd">乙方信息（受托方）</div>
    <div class="field"><label>姓名 / 公司名 <span class="req">*</span></label>
      <input type="text" id="db-name" placeholder="个人姓名或公司名称"></div>
    <div class="field"><label>身份证号</label>
      <input type="text" id="db-id" placeholder="身份证号（公司可不填）" maxlength="18" inputmode="text"></div>
    <div class="field"><label>联系电话 <span class="req">*</span></label>
      <input type="tel" id="db-tel" placeholder="请输入手机号码"></div>
  </div>
</div>

<!-- ── STEP 3 租赁: Contract Details ── -->
<div class="step" id="s3-rental">
  <div class="card">
    <div class="card-hd">车辆与目的地</div>
    <div class="field"><label>车牌号 <span class="req">*</span></label>
      <input type="text" id="r-plate" placeholder="如：粤A·12345"></div>
    <div class="field"><label>核定人数（人）<span class="req">*</span></label>
      <input type="number" id="r-seats" placeholder="如：5" min="1" max="55" inputmode="numeric"></div>
    <div class="field"><label>乙方前往目的地 <span class="req">*</span></label>
      <input type="text" id="r-dest" placeholder="目的地地址"></div>
  </div>
  <div class="card">
    <div class="card-hd">租赁期限</div>
    <div class="field"><label>开始时间 <span class="req">*</span></label>
      <input type="datetime-local" id="r-start"></div>
    <div class="field"><label>结束时间 <span class="req">*</span></label>
      <input type="datetime-local" id="r-end"></div>
  </div>
  <div class="card">
    <div class="card-hd">租赁费用</div>
    <div class="field-row">
      <div class="field"><label>日租金（元/天）</label>
        <input type="number" id="r-dayrate" placeholder="300" inputmode="decimal"></div>
      <div class="field"><label>时租金（元/时）</label>
        <input type="number" id="r-hrrate" placeholder="30" inputmode="decimal"></div>
    </div>
    <div class="field"><label>甲方收取租金（元）<span class="req">*</span></label>
      <input type="number" id="r-rent" placeholder="如：600" inputmode="decimal"></div>
    <div class="field"><label>甲方收取押金（元）<span class="req">*</span></label>
      <input type="number" id="r-deposit" placeholder="如：1000" inputmode="decimal"></div>
  </div>
</div>

<!-- ── STEP 3 代驾: Contract Details ── -->
<div class="step" id="s3-driver">
  <div class="card">
    <div class="card-hd">服务时间</div>
    <div class="field"><label>开始时间 <span class="req">*</span></label>
      <input type="datetime-local" id="d-start"></div>
    <div class="field"><label>结束时间 <span class="req">*</span></label>
      <input type="datetime-local" id="d-end"></div>
  </div>
  <div class="card">
    <div class="card-hd">代驾费用</div>
    <div class="field"><label>费用金额（元）<span class="req">*</span></label>
      <input type="number" id="d-fee" placeholder="如：150" inputmode="decimal"></div>
  </div>
</div>

<!-- ── STEP 4: Signature A ── -->
<div class="step" id="s4">
  <div class="card">
    <div class="card-hd">甲方手写签名</div>
    <p style="font-size:13px;color:#888;margin-bottom:10px;">请用手指在下方区域手写签名</p>
    <div class="sig-wrap">
      <canvas id="cvs-a"></canvas>
      <div class="sig-hint" id="hint-a">
        <div class="sig-hint-icon">✍️</div>
        <div>请在此手写签名</div>
      </div>
    </div>
    <div class="sig-actions">
      <button class="btn-clear" onclick="clearSig('a')">清除重签</button>
    </div>
  </div>
</div>

<!-- ── STEP 5: Signature B ── -->
<div class="step" id="s5">
  <div class="card">
    <div class="card-hd">乙方手写签名</div>
    <p style="font-size:13px;color:#888;margin-bottom:10px;">请用手指在下方区域手写签名</p>
    <div class="sig-wrap">
      <canvas id="cvs-b"></canvas>
      <div class="sig-hint" id="hint-b">
        <div class="sig-hint-icon">✍️</div>
        <div>请在此手写签名</div>
      </div>
    </div>
    <div class="sig-actions">
      <button class="btn-clear" onclick="clearSig('b')">清除重签</button>
    </div>
  </div>
</div>

<!-- ── STEP 6: Review & Generate ── -->
<div class="step" id="s6">
  <div class="card">
    <div class="card-hd">信息确认</div>
    <dl class="review-kv" id="review-kv"></dl>
  </div>
  <button class="gen-btn" onclick="generate()">生成合同</button>
  <p class="gen-note">
    合同将在新页面中打开<br>
    您可截图、打印或使用浏览器"分享"功能保存
  </p>
</div>

</div><!-- /content -->

<!-- NAVIGATION -->
<div class="nav">
  <button class="btn btn-back" id="btn-back" onclick="goBack()" style="display:none">上一步</button>
  <button class="btn btn-fwd"  id="btn-fwd"  onclick="goNext()">下一步</button>
</div>

<script>
'use strict';

var type = null;
var step = 0;
var STEPS = 7;

var stepNames = [
  '选择合同类型',
  '甲方信息',
  '乙方信息',
  '合同详情',
  '甲方签名',
  '乙方签名',
  '确认生成'
];

var sig = {
  a: { ready: false, hasData: false },
  b: { ready: false, hasData: false }
};

/* ── Navigation ── */

function showStep(n) {
  document.querySelectorAll('.step').forEach(function(el) { el.classList.remove('active'); });

  var id = '';
  if      (n === 0) { id = 's0'; }
  else if (n === 1) { id = 's1-' + type; }
  else if (n === 2) { id = 's2-' + type; }
  else if (n === 3) { id = 's3-' + type; }
  else if (n === 4) { id = 's4'; }
  else if (n === 5) { id = 's5'; }
  else if (n === 6) { id = 's6'; }

  var el = document.getElementById(id);
  if (el) el.classList.add('active');

  if (n === 4) { setupCanvas('a'); }
  if (n === 5) { setupCanvas('b'); }
  if (n === 6) { buildReview(); }

  document.getElementById('hdr-title').textContent = stepNames[n];
  document.getElementById('prog').style.width = (n / (STEPS - 1) * 100) + '%';
  document.getElementById('step-info').textContent = '第 ' + (n + 1) + ' 步，共 ' + STEPS + ' 步';

  var back = document.getElementById('btn-back');
  var fwd  = document.getElementById('btn-fwd');
  back.style.display = n > 0 ? 'block' : 'none';

  if (n === 6) {
    fwd.style.display = 'none';
  } else {
    fwd.style.display = 'block';
    fwd.textContent = n === 5 ? '确认完成' : '下一步';
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goNext() {
  if (!validate()) return;
  if (step < STEPS - 1) { step++; showStep(step); }
}

function goBack() {
  if (step > 0) { step--; showStep(step); }
}

/* ── Type Selection ── */

function selectType(t, el) {
  type = t;
  document.querySelectorAll('.type-card').forEach(function(c) { c.classList.remove('sel'); });
  el.classList.add('sel');
}

/* ── Validation ── */

function g(id) {
  var el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

function validate() {
  if (step === 0) {
    if (!type) { alert('请先选择合同类型'); return false; }
  }

  if (step === 1 && type === 'rental') {
    if (!g('ra-name') || !g('ra-loc')) { alert('请填写甲方姓名和签约地点'); return false; }
  }
  if (step === 1 && type === 'driver') {
    if (!g('da-name') || !g('da-id') || !g('da-tel') || !g('da-brand') || !g('da-model') || !g('da-plate')) {
      alert('请填写甲方所有必填信息（标有 * 的项目）'); return false;
    }
  }

  if (step === 2 && type === 'rental') {
    if (!g('rb-name') || !g('rb-loc') || !g('rb-id') || !g('rb-tel')) {
      alert('请填写乙方所有必填信息'); return false;
    }
  }
  if (step === 2 && type === 'driver') {
    if (!g('db-name') || !g('db-tel')) { alert('请填写乙方姓名和联系电话'); return false; }
  }

  if (step === 3 && type === 'rental') {
    if (!g('r-plate') || !g('r-seats') || !g('r-dest') || !g('r-start') || !g('r-end') || !g('r-rent') || !g('r-deposit')) {
      alert('请填写合同所有必填信息（标有 * 的项目）'); return false;
    }
  }
  if (step === 3 && type === 'driver') {
    if (!g('d-start') || !g('d-end') || !g('d-fee')) {
      alert('请填写服务时间和代驾费用'); return false;
    }
  }

  if (step === 4 && !sig.a.hasData) { alert('请完成甲方手写签名'); return false; }
  if (step === 5 && !sig.b.hasData) { alert('请完成乙方手写签名'); return false; }

  return true;
}

/* ── Signature Canvas ── */

function setupCanvas(side) {
  if (sig[side].ready) return;
  requestAnimationFrame(function() {
    var cvs = document.getElementById('cvs-' + side);
    var dpr = window.devicePixelRatio || 1;
    var cssW = cvs.offsetWidth || 340;
    var cssH = 165;
    cvs.width  = cssW * dpr;
    cvs.height = cssH * dpr;

    var ctx = cvs.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    var drawing = false;

    function xy(e) {
      var r = cvs.getBoundingClientRect();
      var src = e.touches ? e.touches[0] : e;
      return [src.clientX - r.left, src.clientY - r.top];
    }

    function onStart(e) {
      e.preventDefault();
      drawing = true;
      var p = xy(e);
      ctx.beginPath();
      ctx.moveTo(p[0], p[1]);
      var hint = document.getElementById('hint-' + side);
      if (hint) hint.style.display = 'none';
      sig[side].hasData = true;
    }

    function onMove(e) {
      e.preventDefault();
      if (!drawing) return;
      var p = xy(e);
      ctx.lineTo(p[0], p[1]);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(p[0], p[1]);
    }

    function onEnd() { drawing = false; ctx.beginPath(); }

    cvs.addEventListener('touchstart', onStart, { passive: false });
    cvs.addEventListener('touchmove',  onMove,  { passive: false });
    cvs.addEventListener('touchend',   onEnd);
    cvs.addEventListener('mousedown',  onStart);
    cvs.addEventListener('mousemove',  onMove);
    cvs.addEventListener('mouseup',    onEnd);
    cvs.addEventListener('mouseleave', onEnd);

    sig[side].ready = true;
  });
}

function clearSig(side) {
  if (!sig[side].ready) return;
  var cvs = document.getElementById('cvs-' + side);
  var dpr = window.devicePixelRatio || 1;
  cvs.getContext('2d').clearRect(0, 0, cvs.width / dpr, cvs.height / dpr);
  var hint = document.getElementById('hint-' + side);
  if (hint) hint.style.display = 'flex';
  sig[side].hasData = false;

/* ── Helpers ── */

function fmtDT(s) {
  if (!s) return '';
  var d = new Date(s);
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 '
       + d.getHours() + '时' + pad(d.getMinutes()) + '分';
}

function fmtD(s) {
  if (!s) return '';
  var d = new Date(s);
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
}

function fmtNow() {
  var d = new Date();
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 '
       + d.getHours() + ':' + pad(d.getMinutes());
}

function pad(n) { return n < 10 ? '0' + n : String(n); }

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* bl(value, minWidthPx) — inline underline blank */
function bl(v, w) {
  return '<span class="bl"' + (w ? ' style="min-width:' + w + 'px"' : '') + '>'

/* dtParts — break a datetime-local string into components */
function dtParts(s) {
  if (!s) return { y:'', mo:'', d:'', h:'', mi:'' };
  var dt = new Date(s);
  return { y: dt.getFullYear(), mo: dt.getMonth()+1, d: dt.getDate(),
           h: dt.getHours(), mi: pad(dt.getMinutes()) };
}
